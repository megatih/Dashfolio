name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    # Path filters only apply to branch pushes: packaging changes build every platform (without publishing) before a tag.
    paths:
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'pubspec.*'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'pubspec.*'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden

  build:
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on 22.04 (glibc 2.35) so the AppImages run on Debian 12, Ubuntu 22.04+ and current Raspberry Pi OS.
          # Flutter publishes no arm64 SDK archive for Linux or Windows: those jobs install Flutter from git (sdk: git).
          - { target: linux, arch: x64, os: ubuntu-22.04, sdk: action }
          - { target: linux, arch: arm64, os: ubuntu-22.04-arm, sdk: git }
          - { target: windows, arch: x64, os: windows-latest, sdk: action }
          - { target: windows, arch: arm64, os: windows-11-arm, sdk: git }
          - { target: macos, arch: universal, os: macos-latest, sdk: action }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: matrix.sdk == 'action'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter SDK (git)
        if: matrix.sdk == 'git'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Cache pub packages (git SDK)
        if: matrix.sdk == 'git'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Flutter from git
        if: matrix.sdk == 'git' && steps.flutter-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          FL="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/flutter"
          rm -rf "$FL"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FL"
          git -C "$FL" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"

      - name: Put git Flutter on PATH and verify its version
        if: matrix.sdk == 'git'
        shell: bash
        run: |
          FL="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/flutter"
          echo "$(cygpath -w "$FL/bin" 2>/dev/null || echo "$FL/bin")" >> "$GITHUB_PATH"
          export PATH="$FL/bin:$PATH"
          flutter config --no-analytics >/dev/null
          GOT="$(flutter --version --machine | sed -n 's/.*"frameworkVersion": *"\([^"]*\)".*/\1/p')"
          echo "Flutter framework version: $GOT (want $FLUTTER_VERSION)"
          [ "$GOT" = "$FLUTTER_VERSION" ] || { echo "::error::Flutter reports $GOT, expected $FLUTTER_VERSION"; exit 1; }
          flutter doctor -v

      - name: Version and build date
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)-dev"
          fi
          # Tags like v1.2.3-beta.1 are not valid for --build-name on every platform: keep the numeric part.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Linux build and packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            imagemagick appstream desktop-file-utils zsync file binutils

      - run: flutter pub get

      - name: Build
        shell: bash
        run: >
          flutter build ${{ matrix.target }} --release
          --build-name="$BUILD_NAME" --build-number="${{ github.run_number }}"
          --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Package (Linux tar.gz)
        if: matrix.target == 'linux' && matrix.arch == 'x64'
        run: |
          mkdir -p dist
          cp -R build/linux/x64/release/bundle Dashfolio
          tar -czf "dist/Dashfolio-${VERSION}-linux-x64.tar.gz" Dashfolio

      - name: Package (Linux AppImage)
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"

          # Record the glibc the bundle needs (the prebuilt sqlite3 library may need more than the build host).
          NEED="$(find "$BUNDLE" -type f \( -name '*.so*' -o -name dashfolio \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "Highest glibc symbol required: $NEED"
          if [ "$(printf '%s\n' GLIBC_2.35 "$NEED" | sort -V | tail -1)" != GLIBC_2.35 ]; then
            echo "::warning::Bundle needs $NEED, newer than the glibc 2.35 baseline"
          fi

          desktop-file-validate linux/packaging/app.dashfolio.dashfolio.desktop
          sed -e "s/@VERSION@/${VERSION%%-*}/" -e "s/@DATE@/$(date -u +%F)/" \
            linux/packaging/app.dashfolio.dashfolio.metainfo.xml.in > "$RUNNER_TEMP/app.dashfolio.dashfolio.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/app.dashfolio.dashfolio.metainfo.xml"

          linux/packaging/build_appimage.sh "$BUNDLE" "${{ matrix.arch }}" "$VERSION" dist

          # Smoke test: the image extracts and carries AppRun, the desktop file, the icons and the bundle.
          APPIMAGE_FILE="$PWD/dist/Dashfolio-${VERSION}-linux-${{ matrix.arch }}.AppImage"
          test -f "$APPIMAGE_FILE.zsync" || { echo "::error::no .zsync file was generated"; exit 1; }
          file "$APPIMAGE_FILE"
          mkdir "$RUNNER_TEMP/extract" && cd "$RUNNER_TEMP/extract"
          "$APPIMAGE_FILE" --appimage-extract >/dev/null
          cd squashfs-root
          for f in AppRun app.dashfolio.dashfolio.desktop app.dashfolio.dashfolio.png \
                   usr/share/applications/app.dashfolio.dashfolio.desktop \
                   usr/share/metainfo/app.dashfolio.dashfolio.appdata.xml \
                   usr/share/icons/hicolor/16x16/apps/app.dashfolio.dashfolio.png \
                   usr/share/icons/hicolor/512x512/apps/app.dashfolio.dashfolio.png \
                   usr/lib/dashfolio/dashfolio usr/lib/dashfolio/data/app_icon.png usr/lib/dashfolio/data/flutter_assets; do
            test -e "$f" || { echo "::error::AppImage is missing $f"; exit 1; }
          done
          file usr/lib/dashfolio/dashfolio

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $release = "build\windows\$arch\runner\Release"
          $wantMachine = if ($arch -eq 'arm64') { 'AA64' } else { '8664' }

          # Ship the VC++ runtime next to the exe: new Snapdragon / Spark laptops often lack the arm64 redistributable.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory |
            Where-Object { $_.Name -match '^\d' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem (Join-Path $redist.FullName $arch) -Directory -Filter 'Microsoft.VC14*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "No $arch VC++ runtime under $($redist.FullName)" }
          Write-Host "VC++ runtime from $($crt.FullName)"
          Get-ChildItem $crt.FullName -File | Where-Object { $_.Name -match '^(msvcp140|vcruntime140)' } |
            Copy-Item -Destination $release -Verbose

          function Get-Machine([string]$path) {
            $fs = [IO.File]::OpenRead($path)
            try {
              $br = New-Object IO.BinaryReader $fs
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              '{0:X4}' -f $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $bad = @()
          Get-ChildItem $release -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object {
            $m = Get-Machine $_.FullName
            Write-Host ("{0,-40} {1}" -f $_.Name, $m)
            if ($m -ne $wantMachine) { $bad += "$($_.Name) is $m, expected $wantMachine" }
          }
          if (-not (Test-Path "$release\dashfolio.exe")) { throw 'dashfolio.exe missing' }
          if ($bad) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }

          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\Dashfolio-$env:VERSION-windows-$arch.zip"

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir dist
          APP="build/macos/Build/Products/Release/Dashfolio.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Dashfolio-${VERSION}-macos.zip"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Dashfolio -srcfolder dmg -ov -format UDZO "dist/Dashfolio-${VERSION}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dashfolio-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dashfolio-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
