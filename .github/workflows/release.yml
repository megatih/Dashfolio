name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags golden

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version and build date
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)-dev"
          fi
          # Tags like v1.2.3-beta.1 are not valid for --build-name on every platform: keep the numeric part.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - run: flutter pub get

      - name: Build
        shell: bash
        run: >
          flutter build ${{ matrix.target }} --release
          --build-name="$BUILD_NAME" --build-number="${{ github.run_number }}"
          --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir dist
          mv build/linux/x64/release/bundle Dashfolio
          tar -czf "dist/Dashfolio-${VERSION}-linux-x64.tar.gz" Dashfolio

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Dashfolio-$env:VERSION-windows-x64.zip"

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir dist
          APP="build/macos/Build/Products/Release/Dashfolio.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Dashfolio-${VERSION}-macos.zip"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Dashfolio -srcfolder dmg -ov -format UDZO "dist/Dashfolio-${VERSION}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dashfolio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dashfolio-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
